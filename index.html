<!DOCTYPE html>
<html lang="ar" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tayseer AgriSaT | Complex Tech. Simple Decisions.</title>
  
  <!-- Google Fonts: Tajawal for Arabic & English readability -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Tajawal', 'system-ui', 'sans-serif'],
          },
          colors: {
            agri: {
              light: '#eff6ff',
              DEFAULT: '#3b82f6',
              dark: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>

  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow-x: hidden; scroll-behavior: smooth; }
    #root { min-height: 100vh; }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
    .dark ::-webkit-scrollbar-thumb { background: #334155; }

    /* Optimized Glass Effect */
    .glass-light { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.5); }
    .glass-dark { background: rgba(20, 20, 20, 0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.05); }
  </style>

  <!-- Import Maps for React, Three.js, Framer Motion -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "three": "https://esm.sh/three@0.160.0",
        "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.15.12?external=react,react-dom,three",
        "@react-three/drei": "https://esm.sh/@react-three/drei@9.96.1?external=react,react-dom,three,@react-three/fiber",
        "framer-motion": "https://esm.sh/framer-motion@11.0.3?external=react,react-dom",
        "lucide-react": "https://esm.sh/lucide-react@0.323.0?external=react"
      }
    }
  </script>

  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 dark:bg-[#030303] text-slate-900 dark:text-white transition-colors duration-700">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, Suspense, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    import { motion, AnimatePresence } from 'framer-motion';
    import { Canvas, useFrame } from '@react-three/fiber';
    import { MeshDistortMaterial, Float, Environment } from '@react-three/drei';
    // Added new icons: Satellite, Database, Wind, ArrowDown, Check
    import { Moon, Sun, Droplet, Sprout, Activity, Cpu, Leaf, MessageSquare, MapPin, Users, Phone, Mail, Combine, ShieldCheck, TrendingUp, DollarSign, Globe2, Building2, Landmark, CheckCircle2, Satellite, Database, Wind, ArrowDown } from 'lucide-react';

    // ----------------------------------------------------
    // HIGHLY OPTIMIZED 3D LIQUID BLOB (Lag Fix)
    // ----------------------------------------------------
    const LiquidBlob = ({ color, isDark }) => {
      const meshRef = useRef();

      useFrame((state) => {
        if (meshRef.current) {
          meshRef.current.rotation.x = state.clock.getElapsedTime() * 0.1;
          meshRef.current.rotation.y = state.clock.getElapsedTime() * 0.15;
        }
      });

      return (
        <Float speed={1.5} rotationIntensity={0.5} floatIntensity={1}>
          <mesh ref={meshRef} scale={1.8}>
            {/* Reduced segments to 32 for massive performance boost on mobile */}
            <sphereGeometry args={[1, 32, 32]} />
            <MeshDistortMaterial
              color={color}
              envMapIntensity={isDark ? 0.5 : 1}
              clearcoat={isDark ? 0.8 : 0.3}
              clearcoatRoughness={0.2}
              metalness={isDark ? 0.8 : 0.2}
              roughness={0.2}
              distort={0.3}
              speed={1.5}
              transmission={isDark ? 0.5 : 0.2}
              thickness={1}
            />
          </mesh>
        </Float>
      );
    };

    // ----------------------------------------------------
    // REUSABLE COMPONENTS
    // ----------------------------------------------------
    const GlassCard = ({ children, delay, colorScheme, className = "" }) => (
      <motion.div
        initial={{ opacity: 0, y: 20 }}
        whileInView={{ opacity: 1, y: 0 }}
        viewport={{ once: true, margin: "-50px" }}
        transition={{ duration: 0.5, delay: delay }}
        whileHover={{ y: -5 }}
        className={`relative overflow-hidden rounded-3xl p-6 md:p-8 glass-light dark:glass-dark shadow-lg dark:shadow-[0_8px_30px_rgb(0,0,0,0.12)] group transition-all duration-300 z-10 ${className}`}
      >
        <div className={`absolute inset-0 bg-gradient-to-br ${colorScheme} opacity-0 group-hover:opacity-[0.03] dark:group-hover:opacity-10 transition-opacity duration-500 pointer-events-none`} />
        <div className="relative z-10 h-full flex flex-col">{children}</div>
      </motion.div>
    );

    const SectionTitle = ({ title, subtitle, gradient }) => (
      <div className="text-center mb-12 md:mb-16" dir="rtl">
        <motion.h2 
          initial={{ opacity: 0, y: 20 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true }}
          className={`text-3xl md:text-5xl font-extrabold mb-4 bg-clip-text text-transparent bg-gradient-to-r ${gradient}`}
        >
          {title}
        </motion.h2>
        {subtitle && (
          <motion.p 
            initial={{ opacity: 0 }} whileInView={{ opacity: 1 }} viewport={{ once: true }} transition={{ delay: 0.2 }}
            className="text-lg md:text-xl text-slate-700 dark:text-slate-300 max-w-3xl mx-auto leading-relaxed"
          >
            {subtitle}
          </motion.p>
        )}
      </div>
    );

    // ----------------------------------------------------
    // HEADER WITH DYNAMIC LOGOS
    // ----------------------------------------------------
    const Header = ({ theme, setTheme, division, setDivision }) => {
      const isAgri = division === 'agrisat';
      const isDark = theme === 'dark';
      
      const getLogoSrc = () => {
        if (isAgri && isDark) return '1000653745_2.png';
        if (isAgri && !isDark) return '1000653744_2.png';
        if (!isAgri && isDark) return '1000653743_2.png';
        if (!isAgri && !isDark) return '1000653742_2.png';
      };

      return (
        <motion.header 
          initial={{ y: -20, opacity: 0 }} animate={{ y: 0, opacity: 1 }}
          className="flex flex-col md:flex-row justify-between items-center py-6 px-4 md:px-8 max-w-7xl mx-auto w-full z-50 relative"
          dir="ltr"
        >
          <div className="flex items-center gap-3 mb-6 md:mb-0">
            <img 
              src={getLogoSrc()} 
              alt="Tayseer Logo" 
              className="h-12 md:h-16 object-contain drop-shadow-md transition-all duration-300"
              onError={(e) => {
                e.target.style.display = 'none';
                document.getElementById('text-logo-fallback').style.display = 'flex';
              }}
            />
            <div id="text-logo-fallback" className="hidden flex-col">
              <h1 className="text-3xl font-black tracking-tight flex items-center">
                Tay<span className={isAgri ? 'text-blue-500' : 'text-purple-500'}>see</span>r
              </h1>
              <span className="text-xs font-bold tracking-widest uppercase text-slate-500">
                {isAgri ? 'Agri-SaT Farms' : 'Lavender Life'}
              </span>
            </div>
          </div>

          <div className="flex items-center gap-4 bg-white/80 dark:bg-black/60 backdrop-blur-md p-1.5 rounded-full border border-slate-200 dark:border-white/10 shadow-sm" dir="rtl">
            <div className="flex rounded-full overflow-hidden bg-slate-100 dark:bg-white/5 relative">
              <button
                onClick={() => setDivision('lavender')}
                className={`relative px-4 md:px-6 py-2 rounded-full text-sm font-bold transition-all duration-300 z-10 ${
                  !isAgri ? 'text-white bg-purple-500 shadow-md' : 'text-slate-600 dark:text-slate-400'
                }`}
              >
                النباتات الطبية
              </button>
              <button
                onClick={() => setDivision('agrisat')}
                className={`relative px-4 md:px-6 py-2 rounded-full text-sm font-bold transition-all duration-300 z-10 ${
                  isAgri ? 'text-white bg-blue-600 shadow-md' : 'text-slate-600 dark:text-slate-400'
                }`}
              >
                المزارع (AgriSaT)
              </button>
            </div>

            <button
              onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}
              className="p-2.5 rounded-full bg-white dark:bg-white/10 shadow-sm hover:scale-105 transition-all"
            >
              {theme === 'dark' ? <Sun size={18} className="text-yellow-400" /> : <Moon size={18} className="text-indigo-900" />}
            </button>
          </div>
        </motion.header>
      );
    };

    // ----------------------------------------------------
    // AGRISAT CONTENT 
    // ----------------------------------------------------
    const AgriSatContent = () => (
      <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="max-w-7xl mx-auto px-4 py-8 md:py-16 space-y-24 md:space-y-32" dir="rtl">
        
        {/* Hero Section */}
        <div className="text-center relative z-10" dir="ltr">
          <motion.div initial={{ scale: 0.9, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} className="inline-block px-4 py-1.5 rounded-full bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 font-bold text-sm mb-6 border border-blue-200 dark:border-blue-700/50 shadow-sm">
            Egyptian Agri-Tech Startup
          </motion.div>
          <motion.h2 initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} className="text-4xl md:text-6xl lg:text-7xl font-black mb-6 bg-clip-text text-transparent bg-gradient-to-r from-blue-700 to-cyan-500 leading-tight">
            Complex Tech.<br/>Simple Decisions.
          </motion.h2>
          <motion.p initial={{ opacity: 0 }} animate={{ opacity: 1 }} transition={{ delay: 0.2 }} className="text-lg md:text-2xl text-slate-700 dark:text-slate-300 max-w-4xl mx-auto leading-relaxed font-medium" dir="rtl">
            منصة زراعية ذكية متكاملة تدمج صور الأقمار الصناعية، الاستشعار عن بعد، الذكاء الاصطناعي، ومستشعرات الحقل منخفضة التكلفة لمساعدة المزارعين على مراقبة صحة المحاصيل، تحسين الري، وتقييم المخاطر البيئية.
          </motion.p>
          
          <motion.div initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ delay: 0.4 }} className="mt-10 flex flex-wrap justify-center gap-4">
            <button className="px-8 py-4 rounded-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-lg shadow-lg shadow-blue-500/30 transition-all hover:-translate-y-1 flex items-center gap-2">
              <MessageSquare size={20} /> طلب ديمو للمزرعة
            </button>
          </motion.div>
        </div>

        {/* FAO 4 Betters Badge */}
        <motion.div 
          initial={{ opacity: 0, y: 20 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true }}
          className="max-w-4xl mx-auto bg-gradient-to-r from-green-50 to-blue-50 dark:from-green-900/20 dark:to-blue-900/20 border border-green-200 dark:border-green-800/50 rounded-2xl p-6 md:p-8 flex flex-col md:flex-row items-center justify-between gap-6 shadow-sm"
        >
          <div className="flex items-center gap-4">
            <div className="bg-white dark:bg-black/50 p-3 rounded-full shadow-sm">
              <Globe2 className="text-green-600 dark:text-green-400" size={32} />
            </div>
            <div>
              <h4 className="text-xl font-bold text-slate-800 dark:text-white mb-1">متوافقون مع أهداف منظمة الأغذية والزراعة (FAO)</h4>
              <p className="text-slate-600 dark:text-slate-400 text-sm">ندعم رؤية المنظمة العالمية نحو استدامة القطاع الزراعي.</p>
            </div>
          </div>
          <div className="flex gap-4 flex-wrap">
            <span className="px-4 py-2 bg-green-100 dark:bg-green-900/40 text-green-800 dark:text-green-300 font-bold rounded-lg text-sm flex items-center gap-2">
              <Sprout size={16}/> إنتاج أفضل (Better Production)
            </span>
            <span className="px-4 py-2 bg-blue-100 dark:bg-blue-900/40 text-blue-800 dark:text-blue-300 font-bold rounded-lg text-sm flex items-center gap-2">
              <Droplet size={16}/> بيئة أفضل (Better Environment)
            </span>
          </div>
        </motion.div>

        {/* NEW: BUSINESS MODELS & TARGET AUDIENCE */}
        <div>
          <SectionTitle 
            title="نماذج عمل مرنة تناسب حجم مزرعتك" 
            subtitle="سواء كنت تدير فداناً واحداً أو آلاف الأفدنة، لدينا خطة تقنية واقتصادية تناسب احتياجاتك."
            gradient="from-blue-600 to-cyan-500"
          />
          <div className="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-5xl mx-auto">
             {/* Small Farmers */}
             <GlassCard delay={0.1} colorScheme="from-emerald-500 to-green-500" className="border-2 border-transparent hover:border-emerald-500/50">
               <div className="flex justify-between items-start mb-6">
                 <div>
                   <h3 className="text-2xl font-black text-emerald-600 dark:text-emerald-400 mb-2">المزارع الصغير</h3>
                   <span className="bg-emerald-100 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-300 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">Pay-Per-Report</span>
                 </div>
                 <div className="p-3 bg-emerald-100 dark:bg-emerald-900/30 rounded-xl">
                   <Users className="text-emerald-600 dark:text-emerald-400" size={32}/>
                 </div>
               </div>
               <ul className="space-y-4 text-slate-700 dark:text-slate-300 text-sm font-medium">
                 <li className="flex items-start gap-3">
                   <CheckCircle2 size={20} className="text-emerald-500 shrink-0 mt-0.5"/> 
                   <span><strong>بدون أجهزة معقدة:</strong> لا حاجة لشراء أو تركيب أي أجهزة مادية في المزرعة.</span>
                 </li>
                 <li className="flex items-start gap-3">
                   <CheckCircle2 size={20} className="text-emerald-500 shrink-0 mt-0.5"/> 
                   <span><strong>الدفع بالطلب:</strong> ادفع فقط مقابل تقارير دورية وبرامج تسميد وري مخصصة.</span>
                 </li>
                 <li className="flex items-start gap-3">
                   <CheckCircle2 size={20} className="text-emerald-500 shrink-0 mt-0.5"/> 
                   <span><strong>تنبيهات بسيطة:</strong> تقارير وتوجيهات سهلة الفهم تصلك مباشرة عبر WhatsApp.</span>
                 </li>
               </ul>
             </GlassCard>

             {/* Large Farms & B2B */}
             <GlassCard delay={0.2} colorScheme="from-blue-500 to-cyan-500" className="border-2 border-transparent hover:border-blue-500/50 relative overflow-hidden">
               <div className="absolute top-0 left-0 bg-gradient-to-r from-blue-600 to-blue-500 text-white text-xs font-bold px-4 py-1.5 rounded-br-xl shadow-sm">B2B / B2G</div>
               <div className="flex justify-between items-start mb-6">
                 <div>
                   <h3 className="text-2xl font-black text-blue-600 dark:text-blue-400 mb-2">المزارع الكبرى والشركات</h3>
                   <span className="bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">Hardware + SaaS</span>
                 </div>
                 <div className="p-3 bg-blue-100 dark:bg-blue-900/30 rounded-xl">
                   <Building2 className="text-blue-600 dark:text-blue-400" size={32}/>
                 </div>
               </div>
               <ul className="space-y-4 text-slate-700 dark:text-slate-300 text-sm font-medium">
                 <li className="flex items-start gap-3">
                   <CheckCircle2 size={20} className="text-blue-500 shrink-0 mt-0.5"/> 
                   <span><strong>نظام متكامل:</strong> اشتراك سنوي يشمل المنصة وأجهزة الحافة الذكية (CM-60 / CM-777).</span>
                 </li>
                 <li className="flex items-start gap-3">
                   <CheckCircle2 size={20} className="text-blue-500 shrink-0 mt-0.5"/> 
                   <span><strong>مراقبة الآلات:</strong> تتبع لحظي واكتشاف صامت لأعطال آلات الري المحوري (Pivots).</span>
                 </li>
                 <li className="flex items-start gap-3">
                   <CheckCircle2 size={20} className="text-blue-500 shrink-0 mt-0.5"/> 
                   <span><strong>استثمار بيئي:</strong> رصد انبعاثات التربة والتأهيل لشهادات الكربون (Carbon Credits) كمصدر دخل إضافي.</span>
                 </li>
               </ul>
             </GlassCard>
          </div>
        </div>

        {/* NEW: INPUTS & OUTPUTS */}
        <div className="relative py-4">
          <SectionTitle 
            title="من البيانات الخام إلى رؤية ميدانية حاسمة" 
            subtitle="نجمع أدق الإشارات الفضائية والأرضية لنستخرج لك مؤشرات زراعية وبيئية لا تقدر بثمن."
            gradient="from-blue-600 to-cyan-500"
          />
          <div className="grid grid-cols-1 lg:grid-cols-[1fr_auto_1fr] gap-6 lg:gap-10 items-center max-w-6xl mx-auto">
             
             {/* Inputs */}
             <div className="space-y-4">
                <div className="bg-slate-200/50 dark:bg-slate-800/50 rounded-2xl p-6 border border-slate-300 dark:border-slate-700">
                  <h4 className="text-xl font-black text-slate-800 dark:text-white mb-6 text-center border-b border-slate-300 dark:border-slate-700 pb-4">المدخلات (الرصد وجمع البيانات)</h4>
                  
                  <div className="space-y-4">
                    <div className="flex items-center gap-4 p-3 hover:bg-white dark:hover:bg-slate-800 rounded-xl transition-colors">
                      <div className="p-3 bg-blue-100 dark:bg-blue-900/50 rounded-lg shrink-0"><Satellite className="text-blue-600 dark:text-blue-400"/></div>
                      <div>
                        <p className="font-bold text-slate-800 dark:text-white">صور الأقمار الصناعية</p>
                        <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">Sentinel-1/2, Landsat 8/9, ERA5</p>
                      </div>
                    </div>
                    
                    <div className="flex items-center gap-4 p-3 hover:bg-white dark:hover:bg-slate-800 rounded-xl transition-colors">
                      <div className="p-3 bg-blue-100 dark:bg-blue-900/50 rounded-lg shrink-0"><Wind className="text-blue-600 dark:text-blue-400"/></div>
                      <div>
                        <p className="font-bold text-slate-800 dark:text-white">مستشعرات الحقل (Edge)</p>
                        <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">غازات التربة (CO2, NH3) ومستشعرات الضغط</p>
                      </div>
                    </div>

                    <div className="flex items-center gap-4 p-3 hover:bg-white dark:hover:bg-slate-800 rounded-xl transition-colors">
                      <div className="p-3 bg-blue-100 dark:bg-blue-900/50 rounded-lg shrink-0"><Cpu className="text-blue-600 dark:text-blue-400"/></div>
                      <div>
                        <p className="font-bold text-slate-800 dark:text-white">حالة آلات الري</p>
                        <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">البيانات الميكانيكية للبيفوت (Pivots)</p>
                      </div>
                    </div>
                  </div>
                </div>
             </div>

             {/* Center Arrow / AI Engine */}
             <div className="flex justify-center py-4 lg:py-0">
                <div className="relative w-16 h-16 lg:w-24 lg:h-24 rounded-full bg-gradient-to-br from-blue-500 to-cyan-500 flex items-center justify-center shadow-[0_0_30px_rgba(59,130,246,0.5)] z-10">
                   <Activity className="text-white animate-pulse" size={36} />
                   <div className="absolute inset-0 rounded-full border-4 border-blue-400/30 animate-[spin_4s_linear_infinite]"></div>
                </div>
                {/* Arrow down for mobile only */}
                <ArrowDown className="text-blue-500 absolute mt-20 lg:hidden animate-bounce" size={24} />
             </div>

             {/* Outputs */}
             <div className="space-y-4">
               <div className="bg-gradient-to-br from-blue-50 to-cyan-50 dark:from-blue-900/20 dark:to-cyan-900/20 rounded-2xl p-6 border-l-4 border-blue-500 shadow-md">
                  <h4 className="text-xl font-black text-blue-900 dark:text-blue-300 mb-6 text-center border-b border-blue-200 dark:border-blue-800/50 pb-4">المخرجات (التحليل والقرارات)</h4>
                  
                  <div className="space-y-4">
                    <div className="flex items-center gap-4 p-3 hover:bg-white/50 dark:hover:bg-black/20 rounded-xl transition-colors">
                      <div className="p-3 bg-white dark:bg-slate-800 rounded-lg shrink-0 shadow-sm"><Leaf className="text-green-500"/></div>
                      <div>
                        <p className="font-bold text-slate-800 dark:text-white">مؤشرات حيوية ومناخية</p>
                        <p className="text-xs text-slate-600 dark:text-slate-400 mt-1">خرائط صحة النبات (NDVI)، الإجهاد المائي (NDWI)، والتبخر النتح الفعلي (Actual ET).</p>
                      </div>
                    </div>
                    
                    <div className="flex items-center gap-4 p-3 hover:bg-white/50 dark:hover:bg-black/20 rounded-xl transition-colors">
                      <div className="p-3 bg-white dark:bg-slate-800 rounded-lg shrink-0 shadow-sm"><Database className="text-amber-500"/></div>
                      <div>
                        <p className="font-bold text-slate-800 dark:text-white">استدامة وكربون التربة</p>
                        <p className="text-xs text-slate-600 dark:text-slate-400 mt-1">تتبع المادة العضوية (SOM)، صافي إمداد الكربون، ورصد انبعاثات الغازات الدفيئة.</p>
                      </div>
                    </div>

                    <div className="flex items-center gap-4 p-3 hover:bg-white/50 dark:hover:bg-black/20 rounded-xl transition-colors">
                      <div className="p-3 bg-white dark:bg-slate-800 rounded-lg shrink-0 shadow-sm"><MessageSquare className="text-blue-500"/></div>
