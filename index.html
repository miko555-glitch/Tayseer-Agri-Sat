<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tayseer AgriSaT | Complex Tech. Simple Decisions.</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- CSS to ensure full screen -->
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow-x: hidden; }
    #root { min-height: 100vh; }
  </style>

  <!-- Import Maps for React, Three.js, Framer Motion, and Icons -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "three": "https://esm.sh/three@0.160.0",
        "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.15.12?external=react,react-dom,three",
        "@react-three/drei": "https://esm.sh/@react-three/drei@9.96.1?external=react,react-dom,three,@react-three/fiber",
        "framer-motion": "https://esm.sh/framer-motion@11.0.3?external=react,react-dom",
        "lucide-react": "https://esm.sh/lucide-react@0.323.0?external=react"
      }
    }
  </script>

  <!-- Babel for parsing JSX in the browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 dark:bg-[#050505] text-slate-900 dark:text-white transition-colors duration-700">
  <div id="root"></div>

  <!-- The React Application -->
  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, Suspense, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    import { motion, AnimatePresence } from 'framer-motion';
    import { Canvas, useFrame } from '@react-three/fiber';
    import { MeshDistortMaterial, Float, Environment, ContactShadows } from '@react-three/drei';
    import { Moon, Sun, Droplet, Sprout, Activity, Cpu, Leaf, MessageSquare, Satellite, Radio, Zap, ShieldCheck } from 'lucide-react';
    import * as THREE from 'three';

    // 1. 3D Background Component (Liquid Glass Blob)
    const LiquidBlob = ({ color, isDark }) => {
      const meshRef = useRef();

      useFrame((state) => {
        if (meshRef.current) {
          meshRef.current.rotation.x = state.clock.getElapsedTime() * 0.2;
          meshRef.current.rotation.y = state.clock.getElapsedTime() * 0.3;
        }
      });

      return (
        <Float speed={2} rotationIntensity={1.5} floatIntensity={2}>
          <mesh ref={meshRef} scale={1.8} position={[0, 0, 0]}>
            <sphereGeometry args={[1, 128, 128]} />
            <MeshDistortMaterial
              color={color}
              envMapIntensity={isDark ? 0.8 : 2}
              clearcoat={1}
              clearcoatRoughness={0.1}
              metalness={0.9}
              roughness={0.1}
              distort={0.4}
              speed={3}
              transmission={0.8}
              thickness={1.5}
            />
          </mesh>
        </Float>
      );
    };

    // 2. Glassmorphism Card Component
    const GlassCard = ({ children, delay, colorScheme }) => {
      return (
        <motion.div
          initial={{ opacity: 0, y: 30 }}
          animate={{ opacity: 1, y: 0 }}
          transition={{ duration: 0.6, delay: delay, ease: "easeOut" }}
          whileHover={{ y: -5, scale: 1.02 }}
          className={`
            relative overflow-hidden rounded-3xl p-8
            backdrop-blur-xl bg-white/10 dark:bg-black/20
            border border-white/20 dark:border-white/10
            shadow-[0_8px_32px_0_rgba(0,0,0,0.1)]
            dark:shadow-[0_8px_32px_0_rgba(0,0,0,0.3)]
            group
          `}
        >
          <div className={`absolute inset-0 bg-gradient-to-br ${colorScheme} opacity-0 group-hover:opacity-10 transition-opacity duration-500`} />
          {children}
        </motion.div>
      );
    };

    // 3. Header / Navigation
    const Header = ({ theme, setTheme, division, setDivision }) => {
      const isAgri = division === 'agrisat';
      const primaryColor = isAgri ? 'text-blue-500' : 'text-purple-500';
      
      return (
        <motion.header 
          initial={{ y: -50, opacity: 0 }}
          animate={{ y: 0, opacity: 1 }}
          className="flex flex-col md:flex-row justify-between items-center py-6 px-4 md:px-8 max-w-7xl mx-auto w-full z-50 relative"
          dir="ltr"
        >
          <div className="flex items-center gap-3 mb-6 md:mb-0">
            <div className={`p-2 rounded-xl backdrop-blur-md bg-white/20 dark:bg-black/20 border border-white/20`}>
              <Satellite size={32} className={primaryColor} />
            </div>
            <div className="flex flex-col">
              <h1 className="text-3xl font-bold tracking-tight flex items-center">
                Tay<span className={primaryColor}>see</span>r
              </h1>
              <span className="text-xs font-medium tracking-widest uppercase opacity-60">
                {isAgri ? 'Agri-SaT Farms' : 'Lavender Life'}
              </span>
            </div>
          </div>

          <div className="flex items-center gap-4 bg-white/10 dark:bg-black/20 backdrop-blur-lg p-2 rounded-full border border-white/20" dir="rtl">
            <div className="flex rounded-full overflow-hidden bg-black/5 dark:bg-white/5 p-1">
              <button
                onClick={() => setDivision('lavender')}
                className={`px-4 py-2 rounded-full text-sm font-semibold transition-all duration-300 ${
                  !isAgri ? 'bg-purple-500 text-white shadow-lg' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
                }`}
              >
                الطبي (Lavender)
              </button>
              <button
                onClick={() => setDivision('agrisat')}
                className={`px-4 py-2 rounded-full text-sm font-semibold transition-all duration-300 ${
                  isAgri ? 'bg-blue-500 text-white shadow-lg' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
                }`}
              >
                المزارع (AgriSaT)
              </button>
            </div>

            <button
              onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}
              className="p-3 rounded-full hover:bg-black/10 dark:hover:bg-white/10 transition-colors"
            >
              {theme === 'dark' ? <Sun size={20} className="text-yellow-400" /> : <Moon size={20} className="text-slate-700" />}
            </button>
          </div>
        </motion.header>
      );
    };

    // 4. AgriSaT Content (Blue)
    const AgriSatContent = () => (
      <motion.div
        initial={{ opacity: 0, x: -50 }}
        animate={{ opacity: 1, x: 0 }}
        exit={{ opacity: 0, x: 50 }}
        transition={{ duration: 0.5 }}
        className="max-w-7xl mx-auto px-4 py-12"
        dir="rtl"
      >
        <div className="text-center mb-20" dir="ltr">
          <motion.h2 
            initial={{ opacity: 0, y: 20 }}
            animate={{ opacity: 1, y: 0 }}
            className="text-4xl md:text-7xl font-extrabold mb-6 bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-cyan-400"
          >
            Complex Tech. Simple Decisions.
          </motion.h2>
          <motion.p 
            initial={{ opacity: 0 }} animate={{ opacity: 1 }} transition={{ delay: 0.2 }}
            className="text-xl md:text-2xl opacity-80 max-w-3xl mx-auto" dir="rtl"
          >
            إطار عمل متكامل يدمج بين صور الأقمار الصناعية ومستشعرات الحافة والذكاء الاصطناعي لتحويل البيانات الزراعية المعقدة إلى قرارات ميدانية بسيطة.
          </motion.p>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
          <GlassCard delay={0.1} colorScheme="from-blue-500 to-cyan-500">
            <Activity className="text-blue-500 mb-6" size={40} />
            <h3 className="text-2xl font-bold mb-4">Field-Ready Visuals</h3>
            <p className="opacity-70 leading-relaxed">
              نحول الخرائط المعقدة إلى خرائط حرارية بسيطة مصممة لاتخاذ القرارات في الحقل مباشرة وليس للمهندسين فقط.
            </p>
          </GlassCard>

          <GlassCard delay={0.2} colorScheme="from-blue-500 to-cyan-500">
            <MessageSquare className="text-blue-500 mb-6" size={40} />
            <h3 className="text-2xl font-bold mb-4">Works Fully Offline</h3>
            <p className="opacity-70 leading-relaxed">
              مساعد الذكاء الاصطناعي مزود بالمعرفة الزراعية ويعمل بكفاءة تامة بدون الحاجة للاتصال بالإنترنت في الحقول البعيدة.
            </p>
          </GlassCard>

          <GlassCard delay={0.3} colorScheme="from-blue-500 to-cyan-500">
            <Cpu className="text-blue-500 mb-6" size={40} />
            <h3 className="text-2xl font-bold mb-4">Sensorless Hardware</h3>
            <p className="opacity-70 leading-relaxed">
              أجهزة تحكم منخفضة التكلفة لمراقبة صحة الآلات والري، ترسل تنبيهات استباقية فورية عبر WhatsApp.
            </p>
          </GlassCard>
        </div>

        <div className="mt-20 grid grid-cols-2 md:grid-cols-4 gap-4 text-center" dir="ltr">
          {[
            { value: "3,500+", label: "Feddans Monitored" },
            { value: "6", label: "Awards & Recognitions" },
            { value: "100%", label: "Data Automation" },
            { value: "0", label: "Dashboards Needed" }
          ].map((stat, i) => (
            <motion.div 
              initial={{ scale: 0.8, opacity: 0 }}
              whileInView={{ scale: 1, opacity: 1 }}
              viewport={{ once: true }}
              transition={{ delay: i * 0.1 }}
              key={i} 
              className="p-6 rounded-2xl bg-white/5 backdrop-blur-md border border-blue-500/20"
            >
              <div className="text-3xl md:text-4xl font-black text-blue-500 mb-2">{stat.value}</div>
              <div className="text-xs md:text-sm font-medium opacity-70 uppercase tracking-wider">{stat.label}</div>
            </motion.div>
          ))}
        </div>
      </motion.div>
    );

    // 5. Lavender Content (Purple)
    const LavenderContent = () => (
      <motion.div
        initial={{ opacity: 0, x: 50 }}
        animate={{ opacity: 1, x: 0 }}
        exit={{ opacity: 0, x: -50 }}
        transition={{ duration: 0.5 }}
        className="max-w-7xl mx-auto px-4 py-12"
        dir="rtl"
      >
        <div className="text-center mb-20" dir="ltr">
          <motion.h2 
            initial={{ opacity: 0, y: 20 }}
            animate={{ opacity: 1, y: 0 }}
            className="text-4xl md:text-7xl font-extrabold mb-6 bg-clip-text text-transparent bg-gradient-to-r from-purple-600 to-pink-500"
          >
            From Space to the Still.
          </motion.h2>
          <motion.p 
            initial={{ opacity: 0 }} animate={{ opacity: 1 }} transition={{ delay: 0.2 }}
            className="text-xl md:text-2xl opacity-80 max-w-3xl mx-auto" dir="rtl"
          >
            الهندسة العكسية لجودة الزيوت العطرية للافندر. نتتبع اللحظة المثالية للحصاد من الفضاء لمنع تعفن الجذور وزيادة الإنتاج.
          </motion.p>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
          <GlassCard delay={0.1} colorScheme="from-purple-500 to-pink-500">
            <div className="flex items-start gap-6">
              <div className="p-4 bg-purple-500/20 rounded-2xl shrink-0">
                <Radio className="text-purple-500" size={40} />
              </div>
              <div>
                <h3 className="text-2xl font-bold mb-3">1. مراقبة فضائية</h3>
                <p className="opacity-70 leading-relaxed">
                  تتتبع الأقمار الصناعية رطوبة النبات كل 10 أيام. تتحول الخريطة للون البنفسجي عند الوصول لنقطة الإجهاد المائي المعتدل، وهي اللحظة المثالية للحصاد.
                </p>
              </div>
            </div>
          </GlassCard>

          <GlassCard delay={0.2} colorScheme="from-purple-500 to-pink-500">
            <div className="flex items-start gap-6">
              <div className="p-4 bg-pink-500/20 rounded-2xl shrink-0">
                <ShieldCheck className="text-pink-500" size={40} />
              </div>
              <div>
                <h3 className="text-2xl font-bold mb-3">2. حماية أرضية</h3>
                <p className="opacity-70 leading-relaxed">
                  متحكمات على صمامات التنقيط تكتشف الانسداد، وتوقف المياه تلقائياً لتجنب تعفن الجذور الحساسة وإرسال تنبيه فوري.
                </p>
              </div>
            </div>
          </GlassCard>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
          <GlassCard delay={0.3} colorScheme="from-purple-500 to-pink-500">
            <Droplet className="text-purple-400 mb-4" size={32} />
            <h4 className="text-xl font-bold mb-2">The 33% Sweet Spot</h4>
            <p className="opacity-70 text-sm">
              العجز المائي بنسبة 33% يحفز النبات لفرز أعلى نسبة من زيت Linalool كآلية دفاعية.
            </p>
          </GlassCard>
          
          <GlassCard delay={0.4} colorScheme="from-purple-500 to-pink-500">
            <Zap className="text-purple-400 mb-4" size={32} />
            <h4 className="text-xl font-bold mb-2">+47% EO Yield</h4>
            <p className="opacity-70 text-sm">
              تطبيق النقطة المثالية (Sweet Spot) يرفع من إنتاجية الزيوت العطرية بنسبة تصل إلى 47٪.
            </p>
          </GlassCard>

          <GlassCard delay={0.5} colorScheme="from-purple-500 to-pink-500">
            <Sprout className="text-purple-400 mb-4" size={32} />
            <h4 className="text-xl font-bold mb-2">Virtual Moisture</h4>
            <p className="opacity-70 text-sm">
              نستخدم حساسات افتراضية مدمجة عبر الأقمار الصناعية دون الحاجة لدفن معدات مكلفة في التربة.
            </p>
          </GlassCard>
        </div>
      </motion.div>
    );

    // 6. Main App Component
    const App = () => {
      const [theme, setTheme] = useState('dark');
      const [division, setDivision] = useState('agrisat');

      useEffect(() => {
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [theme]);

      const isAgri = division === 'agrisat';
      const blobColor = isAgri ? '#3b82f6' : '#8b5cf6';
      const ambientLightColor = isAgri ? '#e0f2fe' : '#f3e8ff';

      return (
        <div className="relative min-h-screen transition-colors duration-700 ease-in-out font-sans overflow-x-hidden">
          {/* Background 3D Canvas */}
          <div className="fixed inset-0 z-0 pointer-events-none">
            <div className="absolute inset-0 bg-gradient-to-b from-transparent to-black/10 dark:to-black/60 z-10" />
            <Canvas camera={{ position: [0, 0, 5], fov: 45 }}>
              <ambientLight intensity={theme === 'dark' ? 0.5 : 1} color={ambientLightColor} />
              <directionalLight position={[10, 10, 5]} intensity={2} />
              <directionalLight position={[-10, -10, -5]} intensity={1} color={blobColor} />
              <Suspense fallback={null}>
                <LiquidBlob color={blobColor} isDark={theme === 'dark'} />
                <Environment preset={theme === 'dark' ? 'night' : 'city'} />
                <ContactShadows position={[0, -2, 0]} opacity={0.5} scale={10} blur={2} far={4} />
              </Suspense>
            </Canvas>
          </div>

          {/* Dynamic Glow */}
          <div 
            className={`fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] md:w-[800px] h-[600px] md:h-[800px] rounded-full blur-[100px] md:blur-[120px] opacity-20 md:opacity-30 pointer-events-none transition-colors duration-1000 z-0
              ${isAgri ? 'bg-blue-600' : 'bg-purple-600'}
            `}
          />

          {/* Foreground UI */}
          <div className="relative z-10 flex flex-col min-h-screen">
            <Header theme={theme} setTheme={setTheme} division={division} setDivision={setDivision} />
            
            <main className="flex-grow flex items-center justify-center">
              <AnimatePresence mode="wait">
                {division === 'agrisat' ? (
                  <AgriSatContent key="agrisat" />
                ) : (
                  <LavenderContent key="lavender" />
                )}
              </AnimatePresence>
            </main>

            <footer className="text-center py-8 opacity-60 text-sm">
              <p>© 2026 Tayseer AgriSaT. All rights reserved.</p>
              <p className="mt-1 flex items-center justify-center gap-2">
                <Leaf size={14} /> Rooted in Egypt. Connected to Space.
              </p>
            </footer>
          </div>
        </div>
      );
    };

    // Render the app
    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
