<body class="bg-slate-50 dark:bg-[#050505] text-slate-900 dark:text-white transition-colors duration-700">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, Suspense, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    import { motion, AnimatePresence } from 'framer-motion';
    import { Canvas, useFrame } from '@react-three/fiber';
    import { MeshDistortMaterial, Float, Environment } from '@react-three/drei';
    import { Moon, Sun, Droplet, Activity, Cpu, Leaf, MessageSquare, MapPin, Users, Phone, Mail, Combine, ShieldCheck, TrendingUp, DollarSign, Building2, CheckCircle2, Satellite, Database, Wind, ArrowDown, Radio } from 'lucide-react';
    import * as THREE from 'three';

    // === 3D LIQUID BLOB COMPONENT === //
    const LiquidBlob = ({ color, isDark }) => {
      const meshRef = useRef();
      useFrame((state) => {
        if (meshRef.current) {
          meshRef.current.rotation.x = state.clock.getElapsedTime() * 0.15;
          meshRef.current.rotation.y = state.clock.getElapsedTime() * 0.2;
        }
      });
      return (
        <Float speed={2} rotationIntensity={1} floatIntensity={1.5}>
          <mesh ref={meshRef} scale={1.8}>
            {/* 32 segments instead of 128 stops lagging on mobile */}
            <sphereGeometry args={[1, 32, 32]} />
            <MeshDistortMaterial
              color={color}
              envMapIntensity={isDark ? 0.8 : 2}
              clearcoat={1}
              clearcoatRoughness={0.1}
              metalness={0.8}
              roughness={0.1}
              distort={0.4}
              speed={2}
              transmission={0.6}
              thickness={1.5}
            />
          </mesh>
        </Float>
      );
    };

    // === UI COMPONENTS === //
    const GlassCard = ({ children, delay, colorScheme, className = "" }) => {
      return (
        <motion.div
          initial={{ opacity: 0, y: 30 }}
          whileInView={{ opacity: 1, y: 0 }}
          viewport={{ once: true, margin: "-50px" }}
          transition={{ duration: 0.6, delay: delay, ease: "easeOut" }}
          whileHover={{ y: -5, scale: 1.02 }}
          className={`relative overflow-hidden rounded-3xl p-6 md:p-8 backdrop-blur-xl bg-white/70 dark:bg-white/5 border border-white/50 dark:border-white/10 shadow-lg dark:shadow-[0_8px_32px_0_rgba(0,0,0,0.2)] group transition-all duration-300 z-10 ${className}`}
        >
          <div className={`absolute inset-0 bg-gradient-to-br ${colorScheme} opacity-0 group-hover:opacity-10 dark:group-hover:opacity-[0.15] transition-opacity duration-500 pointer-events-none`} />
          <div className="relative z-10 h-full flex flex-col">{children}</div>
        </motion.div>
      );
    };

    const SectionTitle = ({ title, subtitle, gradient }) => {
      return (
        <div className="text-center mb-16" dir="rtl">
          <motion.h2 
            initial={{ opacity: 0, y: 20 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true }}
            className={`text-3xl md:text-5xl font-black mb-4 bg-clip-text text-transparent bg-gradient-to-r ${gradient}`}
          >
            {title}
          </motion.h2>
          {subtitle && (
            <motion.p 
              initial={{ opacity: 0 }} whileInView={{ opacity: 1 }} viewport={{ once: true }} transition={{ delay: 0.2 }}

              {subtitle}
            </motion.p>
          )}
        </div>
      );
    };

    const Header = ({ theme, setTheme, division, setDivision }) => {
      const isAgri = division === 'agrisat';
      const isDark = theme === 'dark';
      
      const getLogoSrc = () => {
        if (isAgri && isDark) return '1000653745_2.png'; 
        if (isAgri && !isDark) return '1000653744_2.png'; 
        if (!isAgri && isDark) return '1000653743_2.png'; 
        if (!isAgri && !isDark) return '1000653742_2.png';

      return (
        <motion.header 
          initial={{ y: -30, opacity: 0 }} animate={{ y: 0, opacity: 1 }}

              src={getLogoSrc()} 
              alt="Tayseer Logo"

            </div>
          </div>

          <div className="flex items-center gap-4 bg-white/70 dark:bg-black/40 backdrop-blur-md p-1.5 rounded-full border border-slate-200 dark:border-white/10 shadow-sm" dir="rtl">

                onClick={() => setDivision('lavender')}

            >
              {theme === 'dark' ? <Sun size={18} className="text-yellow-400" /> : <Moon size={18} />}
            </button>
          </div>
        </motion.header>

    };

    const AgriSatContent = () => {

          {/* Hero Section */}

            </motion.div>
            <motion.h2 initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} className="text-5xl md:text-7xl font-black mb-6 bg-clip-text text-transparent bg-gradient-to-r from-blue-700 to-cyan-400 leading-tight">
              Complex Tech.<br/>Simple Decisions.

          </div>

          {/* Features */}

              </p>

            <GlassCard delay={0.2} colorScheme="from-blue-500 to-cyan-500">
              <MessageSquare className="text-blue-600 dark:text-blue-400 mb-6" size={40} />
              <h3 className="text-2xl font-bold mb-4 text-slate-900 dark:text-white">Works Fully Offline</h3>
              <p className="text-slate-600 dark:text-slate-400 leading-relaxed font-medium">
                مساعد الذكاء الاصطناعي (Mini-Tayseer Chat) مزود بالمعرفة الزراعية ويعمل بكفاءة بدون إنترنت ليناسب طبيعة المزارع.
              </p>
            </GlassCard>

            <GlassCard delay={0.3} colorScheme="from-blue-500 to-cyan-500">
              <Cpu className="text-blue-600 dark:text-blue-400 mb-6" size={40} />
              <h3 className="text-2xl font-bold mb-4 text-slate-900 dark:text-white">Sensorless Hardware</h3>

              </p>
            </GlassCard>
          </div>

          {/* Stats */}
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6 text-center" dir="ltr">
            {[
              { value: "3,500+", label: "Feddans Monitored" },
              { value: "6", label: "Awards & Recognitions" },
              { value: "100%", label: "Data Automation" },
              { value: "0", label: "Dashboards Needed" }

                initial={{ scale: 0.9, opacity: 0 }} whileInView={{ scale: 1, opacity: 1 }} viewport={{ once: true }} transition={{ delay: i * 0.1 }} key={i}

                <div className="text-3xl md:text-4xl font-black text-blue-600 dark:text-blue-400 mb-2">{stat.value}</div>

              </motion.div>
            ))}
          </div>

          {/* Marketing: Input / Output Section */}
          <div className="relative py-10">
            <SectionTitle 
              title="من البيانات الخام إلى رؤية ميدانية" 
              subtitle="نجمع الإشارات الفضائية والأرضية لنستخرج لك مؤشرات زراعية وبيئية دقيقة بدون تعقيد."
              gradient="from-blue-600 to-cyan-500"
            />
            <div className="grid grid-cols-1 lg:grid-cols-[1fr_auto_1fr] gap-6 lg:gap-10 items-center max-w-6xl mx-auto">
               {/* Inputs */}
               <div className="space-y-4">
                  <div className="bg-white/70 dark:bg-black/30 backdrop-blur-sm rounded-3xl p-6 border border-slate-200 dark:border-white/10 shadow-sm">
                    <h4 className="text-xl font-black text-slate-800 dark:text-white mb-6 text-center border-b border-slate-200 dark:border-white/10 pb-4">المدخلات (الرصد)</h4>
                    <div className="space-y-4">
                      <div className="flex items-center gap-4 p-3 rounded-2xl bg-slate-50 dark:bg-white/5 border border-slate-100 dark:border-transparent">
                        <div className="p-3 bg-blue-100 dark:bg-blue-900/50 text-blue-600 dark:text-blue-400 rounded-xl"><Satellite/></div>
                        <div>
                          <p className="font-bold text-slate-800 dark:text-white">صور الأقمار الصناعية</p>
                          <p className="text-xs text-slate-500 font-medium mt-1">Sentinel-1/2, Landsat 8/9, ERA5</p>
                        </div>
                      </div>
                      <div className="flex items-center gap-4 p-3 rounded-2xl bg-slate-50 dark:bg-white/5 border border-slate-100 dark:border-transparent">
                        <div className="p-3 bg-blue-100 dark:bg-blue-900/50 text-blue-600 dark:text-blue-400 rounded-xl"><Wind/></div>
                        <div>
                          <p className="font-bold text-slate-800 dark:text-white">مستشعرات الحقل (CM-777)</p>
                          <p className="text-xs text-slate-500 font-medium mt-1">غازات التربة والبيئة (CO2, NH3)</p>
                        </div>
                      </div>
                    </div>
                  </div>
               </div>

               {/* Center Arrow */}
               <div className="flex justify-center py-4 lg:py-0">
                  <div className="relative w-16 h-16 rounded-full bg-gradient-to-br from-blue-500 to-cyan-500 flex items-center justify-center shadow-lg shadow-blue-500/30 z-10">
                     <Activity className="text-white animate-pulse" size={32} />
                  </div>
                  <ArrowDown className="text-blue-500 absolute mt-20 lg:hidden animate-bounce" size={24} />
               </div>

               {/* Outputs */}
               <div className="space-y-4">
                 <div className="bg-blue-50/90 dark:bg-blue-900/20 backdrop-blur-sm rounded-3xl p-6 border-l-4 border-blue-500 shadow-sm">
                    <h4 className="text-xl font-black text-blue-900 dark:text-blue-300 mb-6 text-center border-b border-blue-200 dark:border-blue-800/50 pb-4">المخرجات (التحليل)</h4>
                    <div className="space-y-4">
                      <div className="flex items-center gap-4 p-3 rounded-2xl bg-white dark:bg-black/40 shadow-sm">

                          <p className="font-bold text-slate-800 dark:text-white">مؤشرات حيوية ومناخية</p>

                        <div>

                        </div>
                      </div>
                    </div>
                  </div>

          </div>

          {/* Marketing: Target Audience / Pricing Models */}

              title="نماذج عمل مرنة تناسب حجم مزرعتك" 
              gradient="from-blue-600 to-cyan-500"
            />
            <div className="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-5xl mx-auto">
               <GlassCard delay={0.1} colorScheme="from-emerald-500 to-green-500" className="border-2 border-transparent hover:border-emerald-500/30">
                 <div className="flex justify-between items-start mb-6">
                   <div>
                     <h3 className="text-2xl font-black text-emerald-700 dark:text-emerald-400 mb-2">المزارع الصغير</h3>
                     <span className="bg-emerald-100 dark:bg-emerald-900/40 text-emerald-800 dark:text-emerald-300 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">Pay-Per-Report</span>
                   </div>

    const LavenderContent = () => {
